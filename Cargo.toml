# The development-only bridge/oracle crate lives under `py/bridge` (excluded
# from the published package). `default-members` keeps `cargo build`/`test` on
# the library; use `cargo build -p autorust-bridge` for the Python harness.
[workspace]
members = [".", "py/bridge", "bench/autorust"]
default-members = ["."]

[package]
name = "autorust"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "A multi-backend GPU-compute / ML framework"
license = "MIT"
repository = "https://github.com/apexys/autorust"
homepage = "https://github.com/apexys/autorust"
documentation = "https://docs.rs/autorust"
readme = "README.md"
keywords = ["tinygrad", "tensor", "autograd", "gpu", "compiler"]
categories = ["artificial-intelligence", "science", "hardware-support"]
authors = ["Valentin Buck"]
exclude = [
    # Development-only harnesses: the Python bridge/oracle + pytest gates and
    # the standalone comparison benchmarks. The Markdown docs are published so
    # the links in README.md resolve on crates.io and docs.rs.
    "py/",
    "bench/",
    ".github/",
]

[package.metadata.docs.rs]
# docs.rs builds on x86_64-unknown-linux-gnu, where CUDA and `freeze` are
# default features. List them explicitly so the published docs keep the whole
# backend surface if the default set ever shrinks. No `--cfg docsrs`: the crate
# does not emit `doc(cfg)` badges, so that flag would be dead.
features = ["backend_cuda", "freeze"]

[[bin]]
name = "ocl_smoke"
required-features = ["backend_cl"]

[[bin]]
name = "cuda_smoke"
required-features = ["backend_cuda"]

[[bin]]
name = "metal_smoke"
required-features = ["backend_metal"]

[features]
# `ops_interp` is always compiled (the faithful reference interpreter). The
# default set adds the multithreaded CPU backend (`RAYON`), the dynamically
# loaded native CPU backends (`RUST`/`CC`), OpenCL (`CL`), Metal (macOS), CUDA
# (Linux/Windows; dynamically loaded, no CUDA libraries at build time), and the
# frozen-plan AOT API (`freeze`). Cargo cannot express per-target defaults, so
# `backend_cuda` is enabled everywhere but its dependency and code are gated on
# `any(target_os = "linux", target_os = "windows")`.
default = [
    "backend_rayon",
    "backend_rust",
    "backend_clang",
    "backend_cl",
    "backend_metal",
    "backend_cuda",
    "freeze",
]
# Multithreaded CPU backend (device "RAYON"), parallelized with `rayon`.
backend_rayon = ["dep:rayon", "dep:bytemuck"]
# OpenCL backend (device "CL"), loaded dynamically at run time.
backend_cl = ["dep:libloading"]
# Metal backend (device "METAL"), macOS only. `objc2` links the OS-provided
# `libobjc`/`Metal.framework`; no Xcode or Metal toolchain is needed at build
# time (shaders are compiled at run time by `newLibraryWithSource:`).
backend_metal = [
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:objc2-metal",
    "dep:objc2-metal-performance-shaders",
]
# CUDA backend (operations/codegen on the CUDA driver API via `cudarc`),
# dynamically loaded; no CUDA libraries are required at build time. In the
# default set, but only on the platforms CUDA exists (Linux/Windows): the
# `cudarc` dependency is target-gated and the code uses
# `all(feature = "backend_cuda", any(target_os = "linux", target_os = "windows"))`.
backend_cuda = ["dep:cudarc", "dep:libloading"]
# Native CPU backend: render Rust kernels, compile them with `rustc` to a
# cdylib, and load them with `libloading`. Parallel launches use `rayon`.
backend_rust = ["dep:libloading", "dep:rayon"]
# Native CPU C backend: render C kernels, compile with `$CC` (clang or gcc),
# and load the shared library with `libloading`.
backend_clang = ["dep:libloading", "dep:rayon"]
# Capture a realized schedule and emit a self-contained Rust plan (AOT).
freeze = ["dep:rayon", "backend_rust"]
# Debug knobs, compiled out by default so hot paths never call getenv.
# `trace`: TG_TRACE rule-firing trace.
# `dump`:  TG_DUMP_PRE_EXPAND/TG_DUMP_IDX/TG_DUMP_LST/TG_DUMP_INTERP/TG_DEBUG_LOAD
#          and the TG_M5_STAGES pipeline truncation.
trace = []
dump = []

[[example]]
name = "rayon_bench"
required-features = ["backend_rayon"]

[[example]]
name = "vit_freeze"
required-features = ["freeze"]

[[example]]
name = "cublas_check"
required-features = ["backend_cuda"]

[dependencies]
nanoserde = "0.2.1"
# Multithreaded CPU backend (`backend_rayon`); work-stealing parallelism.
rayon = { version = "1.12", optional = true }
# dtype-native byte reinterpretation for the `ops_rayon` typed evaluator.
bytemuck = { version = "1", optional = true }
# Runtime loading of the `rustc`-built kernel cdylibs (`backend_rust`),
# portable C shared libraries (`backend_clang`), and `libOpenCL` (`backend_cl`).
libloading = { version = "0.9", optional = true }

# CUDA driver + NVRTC, dynamically loaded (`dynamic-loading`) so no CUDA libs are
# needed at build time. `driver`/`nvrtc` only; no cublas/curand/runtime.
# Target-gated: `backend_cuda` is a default feature, but CUDA only exists on
# Linux/Windows, so macOS builds never pull `cudarc` (the code is gated by the
# same `all(feature, target_os)` condition).
[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
cudarc = { version = "0.19", optional = true, default-features = false, features = [
    "std",
    "driver",
    "nvrtc",
    "dynamic-loading",
    "cuda-version-from-build-system",
    "fallback-latest",
] }

# Metal backend (`backend_metal`). Target-gated so non-macOS builds never see
# these; on macOS they link the OS-provided Objective-C runtime and Metal
# framework, so no toolchain or SDK download is required.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true, default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = [
    "std",
    "NSString",
    "NSError",
] }
objc2-metal-performance-shaders = { version = "0.3", optional = true, default-features = false, features = [
    "std",
    "MPSCore",
    "MPSCoreTypes",
    "MPSKernel",
    "MPSMatrix",
    "MPSMatrixMultiplication",
] }
objc2-metal = { version = "0.3", optional = true, default-features = false, features = [
    "std",
    "MTLAllocation",
    "MTLBlitCommandEncoder",
    "MTLBuffer",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLCommandQueue",
    "MTLComputeCommandEncoder",
    "MTLComputePipeline",
    "MTLDevice",
    "MTLLibrary",
    "MTLResource",
    "MTLTypes",
] }

[profile.dev]
opt-level = 1
