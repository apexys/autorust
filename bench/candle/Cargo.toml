[package]
name = "candle-bench"
version = "0.1.0"
edition = "2024"
publish = false
description = "candle side of the autorust cross-framework benchmark (dev-only)"

# Standalone so candle's dependency tree never enters the autorust lockfile.
[workspace]

[dependencies]
candle-core = "0.11.1"
candle-nn = "0.11.1"

[features]
cuda = ["candle-core/cuda", "candle-nn/cuda"]
