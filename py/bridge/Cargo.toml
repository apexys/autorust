[package]
name = "autorust-bridge"
version = "0.0.0"
edition = "2024"
publish = false
description = "Development-only C ABI and oracle binaries for the autorust Python differential harness"

# `py/bridge.py` loads the `cdylib` as
# `target/debug/libautorust_bridge.so`; the `rlib` lets the oracle bins share
# `rebuild`/`graph_summary`. Nothing here ships.
[lib]
name = "autorust_bridge"
crate-type = ["rlib", "cdylib"]

[dependencies]
autorust = { path = "../.." }
# `oracle_tensor` parses the pytest JSON with the same derive the library uses.
nanoserde = "0.2.1"
